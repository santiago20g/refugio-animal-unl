<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Acceso al Sistema - Refugio Animal UNL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#16a34a',
                        'primary-container': '#15803d',
                        'on-primary': '#ffffff',
                        'on-primary-container': '#ffffff',
                        surface: '#f8fafc',
                        'surface-bright': '#ffffff',
                        'surface-container': '#f1f5f9',
                        'on-surface': '#1e293b',
                        'on-surface-variant': '#64748b',
                        'outline-variant': '#e2e8f0',
                        error: '#dc2626',
                        'error-container': '#fef2f2',
                        'on-error-container': '#991b1b'
                    },
                    fontSize: {
                        'headline-lg': ['1.5rem', {fontWeight: '700'}],
                        'headline-md': ['1.25rem', {fontWeight: '700'}],
                        'label-lg': ['0.875rem', {fontWeight: '600'}],
                        'label-md': ['0.75rem', {fontWeight: '600'}],
                        'body-md': ['0.875rem', {fontWeight: '400'}]
                    },
                    spacing: {
                        xs: '0.5rem',
                        sm: '0.75rem',
                        md: '1rem',
                        lg: '1.5rem',
                        xl: '2rem'
                    },
                    maxWidth: {
                        'container-max': '1200px'
                    }
                }
            }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>body { font-family: 'Inter', sans-serif; }</style>
    <script>
        // Evita que el navegador restaure una posición de scroll anterior
        // (por ejemplo, al volver con el botón "Atrás" o recargar la página),
        // lo cual hacía que la tarjeta de login se viera "subida" y tapara
        // el título y el campo Usuario.
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }
        function forceScrollTop() {
            window.scrollTo(0, 0);
        }
        window.addEventListener('pageshow', forceScrollTop);
        window.addEventListener('load', forceScrollTop);
        // El autocompletado de usuario/contraseña de Chrome desplaza la
        // página DESPUÉS de la carga inicial, así que reforzamos el scroll
        // varias veces durante el primer segundo para contrarrestarlo.
        [0, 50, 150, 300, 600, 1000].forEach(function (delay) {
            setTimeout(forceScrollTop, delay);
        });
    </script>
</h:head>
<h:body class="bg-surface min-h-screen flex flex-col">
    <header class="w-full bg-primary-container h-16 flex items-center px-lg shadow-sm">
        <div class="max-w-container-max mx-auto w-full flex items-center gap-sm">
            <svg alt="Logo" class="w-8 h-8" fill="#ffffff" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M4.5 9.5C5.6 9.5 6.5 8.4 6.5 7S5.6 4.5 4.5 4.5 2.5 5.6 2.5 7s0.9 2.5 2 2.5zM9.5 7.5C10.6 7.5 11.5 6.2 11.5 4.5S10.6 1.5 9.5 1.5 7.5 2.8 7.5 4.5s0.9 3 2 3zM14.5 7.5c1.1 0 2-1.3 2-3s-0.9-3-2-3-2 1.3-2 3 0.9 3 2 3zM19.5 9.5c1.1 0 2-1.1 2-2.5S20.6 4.5 19.5 4.5 17.5 5.6 17.5 7s0.9 2.5 2 2.5zM16.9 12.4c-1-1.3-2.1-2.4-4.9-2.4s-3.9 1.1-4.9 2.4C6.1 13.5 4 13.9 4 16.5 4 18.4 5.5 20 7.5 20c1.4 0 2-0.5 4.5-0.5s3.1 0.5 4.5 0.5c2 0 3.5-1.6 3.5-3.5 0-2.6-2.1-3-3.1-4.1z"/>
            </svg>
            <h1 class="text-on-primary font-headline-md text-headline-md">Refugio Animal UNL</h1>
        </div>
    </header>
    <main class="flex-grow flex items-center justify-center w-full px-md py-xl">
        <div class="bg-surface-bright border border-outline-variant rounded-lg p-lg max-w-md w-full shadow-[0px_12px_32px_rgba(0,0,0,0.1)] flex flex-col items-center">
            <div class="text-center mb-xl">
                <h2 class="text-primary-container font-headline-lg text-headline-lg mb-xs">Acceso al Sistema</h2>
                <p class="text-on-surface-variant font-body-md text-body-md">Universidad Nacional de Loja - FEIRNNR</p>
            </div>
            <h:form class="w-full flex flex-col gap-md">
                <div class="flex flex-col gap-xs w-full">
                    <h:outputLabel for="username" value="Usuario:" styleClass="font-label-lg text-label-lg text-on-surface"/>
                    <h:inputText id="username" value="#{loginBean.username}" autocomplete="off" styleClass="w-full bg-surface-bright border border-outline-variant rounded p-sm font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all" placeholder="Ingrese su usuario"/>
                </div>
                <div class="flex flex-col gap-xs w-full relative">
                    <h:outputLabel for="password" value="Contraseña:" styleClass="font-label-lg text-label-lg text-on-surface"/>
                    <h:inputSecret id="password" value="#{loginBean.password}" autocomplete="new-password" styleClass="w-full bg-surface-bright border border-outline-variant rounded p-sm pr-xl font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all" placeholder="Ingrese su contraseña"/>
                </div>
                <h:commandButton value="INGRESAR" action="#{loginBean.login}" styleClass="w-full bg-primary-container text-on-primary font-label-lg text-label-lg rounded py-sm px-md hover:bg-primary transition-colors mt-sm h-12 flex items-center justify-center tracking-wide uppercase"/>
                <h:messages globalOnly="true" styleClass="bg-error-container text-on-error-container p-sm rounded border border-error mt-xs flex items-center gap-sm" infoStyle="background-color: #dcfce7; color: #166534; border-color: #16a34a;"/>
            </h:form>
        </div>
    </main>
    <footer class="w-full py-md text-center border-t border-outline-variant mt-auto bg-surface-container">
        <p class="font-label-md text-label-md text-on-surface-variant m-0">Sistema desarrollado por Grupo 09 - POO 2A - 2026</p>
    </footer>
</h:body>
</html>
